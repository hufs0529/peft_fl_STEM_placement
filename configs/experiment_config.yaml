# 본 실험용 config (Week 4, 연구계획서 Task 1/Task 2 반영, Week 5 지도교수
# 피드백으로 설계 개정)
#
# 개정된 core design: 압축률(LoRA=무압축/QLoRA 8bit/QLoRA 4bit) x
#              FL(FedAvg/FedProx) x Dirichlet alpha(0.1/1/10)
#              = 18 combinations, 8 clients, 최대 10라운드,
#              3라운드/<1%개선 수렴 기준. 지도교수 피드백: 이 연구의
#              중점을 "압축률과 non-IID 강도의 상관관계"로 재설정 —
#              SCAFFOLD는 core 설계에서 제외(코드/테스트는 유지).
#
# 이 파일 하나로 18개 조합 + Task 2 진단 실험(local_epochs=5)을 전부
# 커버합니다. scripts/run_experiment.py의 --peft --fl --alpha
# --qlora-bits --local-epochs 인자가 아래 기본값을 override합니다.
#
# Config for the main experiment (Week 4, reflects Task 1/Task 2 of the
# research proposal; design revised in Week 5 per advisor feedback).
#
# Revised core design: compression (LoRA=uncompressed / QLoRA 8-bit /
#              QLoRA 4-bit) x FL (FedAvg/FedProx) x Dirichlet alpha
#              (0.1/1/10) = 18 combinations, 8 clients, up to 10
#              rounds, convergence criterion of 3 rounds / <1%
#              improvement. Advisor feedback reframed this project's
#              focus as "the correlation between compression rate and
#              non-IID intensity" — SCAFFOLD is dropped from the core
#              design (its code/tests are kept).
#
# This single file covers the 18 combinations plus the Task 2
# diagnostic experiment (local_epochs=5) in full. The
# --peft --fl --alpha --qlora-bits --local-epochs arguments of
# scripts/run_experiment.py override the defaults below.

# name: 3B에서 1B급으로 축소(지도교수 피드백) — Qwen 계열 유지를 위해
# Qwen2.5 라인업 중 1B에 가장 가까운 1.5B-Instruct 사용
# name: downsized from 3B to a ~1B-class model (advisor feedback) — kept
# within the Qwen family by using Qwen2.5-1.5B-Instruct, the closest
# available size to 1B in the Qwen2.5 lineup
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"

data:
  # subset_size: null = use the entire Dolly-15k
  subset_size: null              # null = 전체 Dolly-15k 사용
  max_seq_length: 512
  # holdout_fraction: held-out evaluation set (PPL is computed over this
  # entire set every round)
  holdout_fraction: 0.1          # held-out 평가셋(PPL은 이 전체로 매 라운드 계산)
  # rouge_l_sample_size: ROUGE-L requires generation and is expensive ->
  # category-stratified sample only, once at the last round
  rouge_l_sample_size: 200       # ROUGE-L은 생성이 필요해 비쌈 -> 카테고리 층화 샘플만, 마지막 라운드 1회

federated:
  num_clients: 8
  # num_rounds: up to 10 rounds (Subtask 1.2)
  num_rounds: 10                 # 최대 10라운드 (Subtask 1.2)
  # fraction_fit: all 8 clients participate every round
  fraction_fit: 1.0               # 8클라이언트 전원 매 라운드 참여
  # local_epochs: Subtask 2.2 robustness check: override to 5
  local_epochs: 1                 # Subtask 2.2 강건성 점검: 5로 override

# --- core (지도교수 피드백 반영 개정): 아래 18개 조합을 실행 ---
#   compression x fl x alpha, 예: --peft lora --fl fedavg --alpha 0.1
#   (lora | qlora --qlora-bits 8 | qlora --qlora-bits 4)
#     x (fedavg | fedprox) x (--alpha 0.1 | 1 | 10)
#   scripts/analyze_interaction.py가 18개 로그를 모아 압축률 x alpha
#   상관관계를 계산.
# --- core (revised per advisor feedback): run the 18 combinations below ---
#   compression x fl x alpha, e.g. --peft lora --fl fedavg --alpha 0.1
#   (lora | qlora --qlora-bits 8 | qlora --qlora-bits 4)
#     x (fedavg | fedprox) x (--alpha 0.1 | 1 | 10)
#   scripts/analyze_interaction.py aggregates the 18 logs to compute the
#   compression x alpha correlation.
peft:
  type: "lora"
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  # qlora_bits: 압축률 스윕용(지도교수 피드백) — 4(NF4, 기본) 또는 8(INT8).
  # scripts/run_experiment.py의 --qlora-bits 인자가 이 값을 override.
  # qlora_bits: for the compression-rate sweep (advisor feedback) — 4
  # (NF4, default) or 8 (INT8). Overridden by --qlora-bits in
  # scripts/run_experiment.py.
  qlora_bits: 4

fl_algorithm:
  type: "fedavg"
  # proximal_mu: hyperparameter for fedprox/scaffold
  proximal_mu: 0.01               # fedprox/scaffold 관련 하이퍼파라미터

partitioning:
  # alpha: 기본값(1)일 뿐, 18조합 설계에서는 scripts/run_experiment.py의
  # --alpha 인자로 {0.1, 1, 10} 세 값 전부를 실제로 스윕함(지도교수 피드백
  # — 압축률x non-IID 상관관계가 이 실험의 핵심 축).
  # alpha: just the default (1) here — in the 18-combination design, all
  # three values {0.1, 1, 10} are actually swept via --alpha in
  # scripts/run_experiment.py (advisor feedback — the compression x
  # non-IID correlation is the core axis of this experiment).
  alpha: 1
  min_category_threshold: 150

training:
  optimizer: "adamw"
  # learning_rate: PyYAML cannot parse "2e-4" (no decimal point) as a
  # float and parses it as a string instead, so keep the "2.0e-4" format
  learning_rate: 2.0e-4          # PyYAML은 "2e-4"(소수점 없음)를 float로 못 읽고 문자열로 파싱하므로 "2.0e-4" 형식 유지
  micro_batch_size: 4
  grad_accumulation_steps: 4      # effective batch size 16

convergence:
  # min_improvement_pct: early stop if <1% improvement for 3 consecutive
  # rounds (Subtask 1.2)
  min_improvement_pct: 1.0        # 3라운드 연속 <1% 개선 시 조기종료 (Subtask 1.2)
  patience_rounds: 3

checkpointing:
  enabled: true
  save_every_round: true
  path: "results/checkpoints/experiment/"

logging:
  # use_wandb: recommended to enable live monitoring starting from Week 4
  use_wandb: true                 # Week 4부터 실시간 모니터링 활성화 권장
  wandb_project: "dolly15k-fl-peft"
  # Subtask 2.3 분석용 로깅 — fl_runner.py가 매 라운드 자동 기록
  # Logging for Subtask 2.3 analysis — fl_runner.py records this
  # automatically every round
  log_per_category_metrics: true
  log_communication_bytes: true
