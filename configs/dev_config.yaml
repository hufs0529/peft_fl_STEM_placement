# Miniature config for verification (Week 1-3, stages 1-6)
# Goal: quickly check "does the code run without error and as intended",
# not performance

model:
  # A tiny model for wiring verification. It must be a Llama-family model
  # with the same q_proj/v_proj attention structure as Qwen2.5 (the main
  # experiment model) for src/models.py's LoraConfig(target_modules=
  # ["q_proj","v_proj"]) to line up correctly

  # The role of two layers in Transformer Self-Attention
  # q_proj: It is a layer that generates a 'search query' (question) to determine the relationship an input token should have with other tokens.
  # v_proj: This is the layer that extracts the "original semantic information/value" to be passed on to the subsequent layer once the associations (attention weights) with other tokens have been calculated.
  name: "hf-internal-testing/tiny-random-LlamaForCausalLM"
  # name: "Qwen/Qwen2.5-3B-Instruct" 

data:
  # Number of samples per client (very small amount)
  subset_size: 20             
  max_seq_length: 128
  holdout_fraction: 0.1
  # Number of category-stratified samples for ROUGE-L generation
  # evaluation (small for dev)
  rouge_l_sample_size: 4       

federated:
  # Small-scale multi-client test
  num_clients: 2               
  num_rounds: 2
  fraction_fit: 1.0
  local_epochs: 1

peft:
  # lora | qlora | dora
  type: "lora"                  # lora | qlora | dora
  lora_r: 4 # It refers to the rank ($r$) of the low-rank matrices ($A, B$) added in LoRA.
  lora_alpha: 8 # This is a hyperparameter that determines the extent to which the LoRA adapter is applied to the original model's weights (scaling factor).
  lora_dropout: 0.05

fl_algorithm:
  # fedavg | fedprox | scaffold
  type: "fedavg"                # fedavg | fedprox | scaffold
  proximal_mu: 0.01

partitioning:
  # Fixed value (research proposal Subtask 1.1)
  alpha: 0.5               
  min_category_threshold: 150

training:
  optimizer: "adamw"
  # PyYAML can't parse "2e-4" (no decimal point) as a float — it parses it
  # as a string — so the "2.0e-4" format is kept
  learning_rate: 2.0e-4       
  micro_batch_size: 2
  grad_accumulation_steps: 2

convergence:
  min_improvement_pct: 1.0
  patience_rounds: 3

checkpointing:
  enabled: true
  save_every_round: true
  path: "results/checkpoints/dev/"

logging:
  use_wandb: false
  wandb_project: "dolly15k-fl-peft"
  log_per_category_metrics: true
  log_communication_bytes: true
